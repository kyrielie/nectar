name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  ios-simulator-test:
    name: iOS Simulator Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail

          test_log="${RUNNER_TEMP}/Nectar-iOS-test.log"
          result_bundle="${RUNNER_TEMP}/Nectar-iOS.xcresult"
          rm -rf "$result_bundle"

          set -o pipefail
          xcodebuild \
            -project NetNewsWire.xcodeproj \
            -scheme Nectar-iOS \
            -testPlan Nectar-CI \
            -xcconfig .github/ios-ci-no-signing.xcconfig \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -resultBundlePath "$result_bundle" \
            OTHER_SWIFT_FLAGS='$(inherited) -DDEBUG -DSKIP_APP_GROUP_ACCESS' \
            test 2>&1 | tee "$test_log" | xcbeautify --renderer github-actions

      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result_bundle="${RUNNER_TEMP}/Nectar-iOS.xcresult"
          if [ -d "$result_bundle" ]; then
            xcrun xcresulttool get test-results summary --path "$result_bundle" \
              > "${RUNNER_TEMP}/Nectar-iOS-testresults.json" || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nectar-ios-test-results
          path: |
            ${{ runner.temp }}/Nectar-iOS.xcresult
            ${{ runner.temp }}/Nectar-iOS-testresults.json
          if-no-files-found: warn
          retention-days: 14


    name: iOS Simulator Build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail

          build_log="${RUNNER_TEMP}/NetNewsWire-iOS-build.log"

          set -o pipefail
          xcodebuild \
            -project NetNewsWire.xcodeproj \
            -scheme Nectar-iOS \
            -xcconfig .github/ios-ci-no-signing.xcconfig \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            OTHER_SWIFT_FLAGS='$(inherited) -DDEBUG -DSKIP_APP_GROUP_ACCESS' \
            build 2>&1 | tee "$build_log" | xcbeautify --renderer github-actions

          ./buildscripts/fail_on_warnings.sh "$build_log"
