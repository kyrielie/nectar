name: CI

# Not triggered by pull requests or pushes. It runs in two ways only:
#   - workflow_call from release.yml, as the gate that must pass before the
#     release tag is created and the IPA is built. release.yml passes the
#     commit it is about to release as `ref`.
#   - workflow_dispatch, to run the whole suite by hand on any branch (pick the
#     branch in the "Run workflow" dropdown). `test.sh` runs the iOS tests locally.
# See docs/release-pipeline.md. If a branch protection rule or ruleset lists any
# of these jobs as a required status check, remove it: with no PR trigger the
# check never reports and pull requests would wait on it forever.
#
# There is deliberately no `concurrency:` block. A workflow_call run is part of a
# release, and `cancel-in-progress` would let a second run on the same ref cancel
# the gate of the first.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA (or ref) to check out and test."
        required: false
        default: ""
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tests/JS
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tests/JS/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  appstore-assets:
    name: App Store Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      # release.yml publishes appstore/screenshots to gh-pages with cp -R, so a
      # symlink (for example into fastlane's output) would dangle there. Catch
      # it here instead of at release time.
      - name: Check committed screenshots
        shell: bash
        run: |
          set -euo pipefail
          dir=appstore/screenshots
          if [ ! -d "$dir" ]; then
            echo "No $dir; nothing to check."
            exit 0
          fi
          status=0
          if [ -n "$(find "$dir" -type l)" ]; then
            echo "::error::$dir contains symlinks; commit real PNG copies (bundle exec fastlane appstore_screenshots)."
            find "$dir" -type l
            status=1
          fi
          for f in "$dir"/*.png; do
            [ -e "$f" ] || continue
            magic=$(head -c 8 "$f" | od -An -tx1 | tr -d ' \n')
            if [ "$magic" != "89504e470d0a1a0a" ]; then
              echo "::error file=$f::not a PNG file"
              status=1
            fi
          done
          if [ ! -f appstore/icon.png ]; then
            echo "::warning::appstore/icon.png is missing; release.yml will fail without it."
          fi
          exit $status

  theme-gallery:
    name: Theme Gallery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Gallery tests
        run: python3 -m unittest discover -s gallery

      # Runs the bundle checks (comment macros, @import placement, duplicate
      # ThemeIdentifier, Version) over every bundle and writes the zips.
      - name: Build gallery
        run: python3 gallery/build.py --out "$RUNNER_TEMP/gallery"

      # `gallery/build.py --check-release-identity origin/<base>` is not run here
      # any more: it compares against a pull request's base branch, and this
      # workflow no longer runs on pull requests. Run it by hand when a bundle's
      # stylesheet.css or template.html changes (see docs/theme-gallery.md).

  # Runs the upstream nnw-theme release gate (render and test in WebKit) on the bundles
  # in gallery/upstream-compatible.txt. Node 24 is nnw-theme's minimum. The ubuntu-26.04
  # runner is the one nnw-theme's own reusable workflow uses with `setup --with-deps`.
  # To move to a newer nnw-theme, change NNW_THEME_VERSION here and DEFAULT_VERSION in
  # gallery/upstream_compat.py together (a test checks they agree).
  upstream-compat:
    name: Upstream Compatibility
    runs-on: ubuntu-26.04
    env:
      NNW_THEME_VERSION: "2.0.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm and WebKit
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: nnw-theme-${{ runner.os }}-${{ runner.arch }}-${{ env.NNW_THEME_VERSION }}

      - name: Install WebKit
        run: npx --yes "nnw-theme@$NNW_THEME_VERSION" setup --with-deps

      - name: Check listed bundles
        run: >-
          python3 gallery/upstream_compat.py
          --nnw-theme-version "$NNW_THEME_VERSION"
          --report-dir "$RUNNER_TEMP/upstream-compat"

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-compat-reports
          path: ${{ runner.temp }}/upstream-compat
          if-no-files-found: warn
          retention-days: 14

  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Check test plan covers every package test target
        run: scripts/check-test-plan.sh

  ios-simulator-test:
    name: iOS Simulator Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail

          test_log="${RUNNER_TEMP}/Nectar-iOS-test.log"
          result_bundle="${RUNNER_TEMP}/Nectar-iOS.xcresult"
          rm -rf "$result_bundle"

          set -o pipefail
          xcodebuild \
            -project NetNewsWire.xcodeproj \
            -scheme Nectar-iOS \
            -testPlan Nectar-CI \
            -xcconfig .github/ios-ci-no-signing.xcconfig \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -resultBundlePath "$result_bundle" \
            OTHER_SWIFT_FLAGS='$(inherited) -DDEBUG -DSKIP_APP_GROUP_ACCESS' \
            test 2>&1 | tee "$test_log" | xcbeautify --renderer github-actions

      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result_bundle="${RUNNER_TEMP}/Nectar-iOS.xcresult"
          if [ -d "$result_bundle" ]; then
            xcrun xcresulttool get test-results summary --path "$result_bundle" \
              > "${RUNNER_TEMP}/Nectar-iOS-testresults.json" || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nectar-ios-test-results
          path: |
            ${{ runner.temp }}/Nectar-iOS.xcresult
            ${{ runner.temp }}/Nectar-iOS-testresults.json
          if-no-files-found: warn
          retention-days: 14

  ios-simulator-build:
    name: iOS Simulator Build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail

          build_log="${RUNNER_TEMP}/NetNewsWire-iOS-build.log"

          set -o pipefail
          xcodebuild \
            -project NetNewsWire.xcodeproj \
            -scheme Nectar-iOS \
            -xcconfig .github/ios-ci-no-signing.xcconfig \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            OTHER_SWIFT_FLAGS='$(inherited) -DDEBUG -DSKIP_APP_GROUP_ACCESS' \
            build 2>&1 | tee "$build_log" | xcbeautify --renderer github-actions

          ./buildscripts/fail_on_warnings.sh "$build_log"
