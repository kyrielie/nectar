name: Regenerate theme color table

# Manual only. Runs scripts/regenerate-theme-colors.sh on a macOS runner and
# opens a pull request when iOS/Resources/ThemeColorTable.json changed.
# Needs the repository setting "Allow GitHub Actions to create and approve
# pull requests" (Settings > Actions > General). See docs/theme-testing.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to regenerate on and open the pull request against."
        required: false
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate ThemeColorTable.json
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate and verify
        run: scripts/regenerate-theme-colors.sh

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- iOS/Resources/ThemeColorTable.json)" ]; then
            echo "::notice::ThemeColorTable.json is already up to date."
            exit 0
          fi
          branch="theme-color-table-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add iOS/Resources/ThemeColorTable.json
          git commit -m "Regenerate ThemeColorTable.json"
          git push origin "$branch"
          gh pr create --base "$BASE" --head "$branch" \
            --title "Regenerate ThemeColorTable.json" \
            --body "Generated by the Regenerate theme color table workflow (run ${GITHUB_RUN_ID})."
