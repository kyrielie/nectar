name: Release IPA and Publish Source

# Two independent ways in:
#   - workflow_dispatch: the full build -> attach IPA -> publish source.json
#     flow for a tag.
#   - release (edited): source.json's localizedDescription is a snapshot of
#     the release body taken by the "Resolve release" step below, at
#     whatever point publish-source happens to run. If you edit a release's
#     notes on GitHub *after* the dispatch run already published source.json
#     (the normal flow for hand-writing a changelog once the auto-generated
#     notes are in front of you), that edit previously never made it to the
#     AltStore source -- there was no trigger to re-run publish-source, so
#     source.json kept showing whatever the body was at creation time. This
#     trigger re-runs just publish-source (no rebuild, the IPA is untouched)
#     so an edited release's notes actually reach source.json.
#     Deliberately not "published": that fires on the same initial
#     gh release create the dispatch flow already does, which would kick off
#     a second, redundant publish-source run racing the first for the
#     gh-pages push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/attach the IPA to (e.g. v0.1.1)"
        required: true
        type: string
  release:
    types: [edited]

permissions:
  contents: write

jobs:
  build-ipa-release:
    name: Build and Release Unsigned IPA
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    outputs:
      tag: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        shell: bash
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/Nectar.xcarchive"
          build_log="${RUNNER_TEMP}/Nectar-archive-build.log"
          rm -rf "$archive_path"

          # Suffix CURRENT_PROJECT_VERSION with the run number so the buildVersion
          # embedded in this ipa matches the one publish-source writes to
          # source.json -- AltStore refuses to install if they disagree.
          base_project_version=$(xcodebuild -showBuildSettings \
            -project NetNewsWire.xcodeproj \
            -scheme Nectar-iOS \
            -destination "generic/platform=iOS" \
            | grep -m1 '^\s*CURRENT_PROJECT_VERSION' | awk -F'= ' '{print $2}')
          build_version="${base_project_version}.${GITHUB_RUN_NUMBER}"

          set -o pipefail
          xcodebuild \
            -project NetNewsWire.xcodeproj \
            -scheme Nectar-iOS \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$build_version" \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive 2>&1 | tee "$build_log" | xcbeautify --renderer github-actions

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/Nectar.xcarchive"
          payload_dir="${RUNNER_TEMP}/Payload"
          ipa_path="${RUNNER_TEMP}/Nectar-unsigned.ipa"

          app_path=$(find "$archive_path/Products/Applications" -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$app_path" ]; then
            echo "No .app found in archive products" >&2
            exit 1
          fi

          rm -rf "$payload_dir" "$ipa_path"
          mkdir -p "$payload_dir"
          cp -R "$app_path" "$payload_dir/"

          (cd "${RUNNER_TEMP}" && zip -qr "$(basename "$ipa_path")" "Payload")

          mkdir -p build-output
          cp "$ipa_path" build-output/

          echo "IPA_PATH=build-output/Nectar-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nectar-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${{ inputs.tag }}"

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$IPA_PATH" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" "$IPA_PATH" \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --generate-notes
          fi

  publish-source:
    name: Publish source.json
    needs: build-ipa-release
    # needs.build-ipa-release normally makes this job skip whenever the
    # needed job is skipped (which it always is on a `release` trigger,
    # since build-ipa-release's own `if` only allows workflow_dispatch) --
    # `always()` plus the explicit success/event check overrides that so
    # a release-edited run isn't skipped, while a workflow_dispatch run
    # still won't proceed past a failed build.
    if: always() && (github.event_name == 'release' || needs.build-ipa-release.result == 'success')
    runs-on: macos-26
    steps:
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            tag_name="${{ github.event.release.tag_name }}"
          else
            tag_name="${{ needs.build-ipa-release.outputs.tag }}"
          fi
          release_json=$(gh api "repos/${{ github.repository }}/releases/tags/$tag_name")
          release_id=$(echo "$release_json" | jq -r '.id')
          published_at=$(echo "$release_json" | jq -r '.published_at')
          body=$(echo "$release_json" | jq -r '.body // ""')

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "$body"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          path: repo

      - name: Checkout main (scripts and templates)
        uses: actions/checkout@v5
        with:
          # Explicit ref: without this, checkout defaults to whatever ref
          # triggered the run -- for workflow_dispatch that's normally
          # main, but for the `release` (edited) trigger github.ref is the
          # release's own tag, not main. update_source.py and
          # source.template.json should always come from main regardless
          # of which trigger fired.
          ref: main
          path: main

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: repo
        run: xcodegen generate

      - name: Read build settings
        id: settings
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail

          settings=$(xcodebuild -showBuildSettings \
            -project NetNewsWire.xcodeproj \
            -scheme Nectar-iOS \
            -destination "generic/platform=iOS" 2>xcodebuild-showbuildsettings.log) || {
            echo "::error::xcodebuild -showBuildSettings failed. stderr was:"
            cat xcodebuild-showbuildsettings.log
            echo "::error::Available schemes in this checkout:"
            xcodebuild -list -project NetNewsWire.xcodeproj || true
            exit 1
          }

          marketing_version=$(echo "$settings" | grep -m1 '^\s*MARKETING_VERSION' | awk -F'= ' '{print $2}')
          current_project_version=$(echo "$settings" | grep -m1 '^\s*CURRENT_PROJECT_VERSION' | awk -F'= ' '{print $2}')
          min_os_version=$(echo "$settings" | grep -m1 '^\s*IPHONEOS_DEPLOYMENT_TARGET' | awk -F'= ' '{print $2}')

          # Suffix with the workflow run number so buildVersion is unique even when
          # re-publishing over a clobbered release without bumping xcconfig. AltStore
          # only surfaces an update when version and/or buildVersion changes.
          build_version="${current_project_version}.${GITHUB_RUN_NUMBER}"

          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "min_os_version=$min_os_version" >> "$GITHUB_OUTPUT"

      - name: Find IPA release asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          asset_json=$(gh api "repos/${{ github.repository }}/releases/${{ steps.release.outputs.release_id }}/assets" \
            --jq '[.[] | select(.name | endswith(".ipa"))][0]')

          if [ -z "$asset_json" ] || [ "$asset_json" = "null" ]; then
            echo "No .ipa asset found on release ${{ steps.release.outputs.tag_name }}" >&2
            exit 1
          fi

          download_url=$(echo "$asset_json" | jq -r '.browser_download_url')
          size=$(echo "$asset_json" | jq -r '.size')

          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: pages

      - name: Initialize gh-pages branch if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d pages/.git ]; then
            rm -rf pages
            mkdir pages
            (cd pages && git init -b gh-pages)
          fi

      - name: Merge new version into source.json
        shell: bash
        env:
          VERSION: ${{ steps.settings.outputs.marketing_version }}
          BUILD_VERSION: ${{ steps.settings.outputs.build_version }}
          RELEASE_DATE: ${{ steps.release.outputs.published_at }}
          RELEASE_NOTES: ${{ steps.release.outputs.body }}
          DOWNLOAD_URL: ${{ steps.asset.outputs.download_url }}
          SIZE_BYTES: ${{ steps.asset.outputs.size }}
          MIN_OS_VERSION: ${{ steps.settings.outputs.min_os_version }}
        run: |
          set -euo pipefail

          existing_arg=""
          if [ -f pages/source.json ]; then
            existing_arg="--existing=pages/source.json"
          fi

          python3 main/scripts/update_source.py \
            --template=main/appstore/source.template.json \
            $existing_arg \
            --output=pages/source.json

      - name: Sync icon and screenshots
        shell: bash
        run: |
          set -euo pipefail
          cp main/appstore/icon.png pages/icon.png
          rm -rf pages/screenshots
          if [ -d main/appstore/screenshots ] && [ "$(ls -A main/appstore/screenshots 2>/dev/null)" ]; then
            cp -R main/appstore/screenshots pages/screenshots
          fi

      - name: Commit and push gh-pages
        working-directory: pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" 2>/dev/null || true
          git commit -m "Publish ${{ steps.release.outputs.tag_name }} to source.json"
          git push origin HEAD:gh-pages
