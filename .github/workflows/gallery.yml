name: Publish theme gallery

# Builds gallery/ and publishes it to the gh-pages branch under /themes/,
# alongside the AltStore source.json that release.yml already publishes there.
# Only files under themes/ are touched, so source.json is never clobbered.

on:
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - "gallery-themes/**"
      - "Themes/**"
      - "Shared/Article Rendering/core.css"
  workflow_dispatch:

permissions:
  contents: write

# Serializes gallery runs with each other only. release.yml (publish-source)
# also pushes to gh-pages, but it is deliberately not in this group: a shared
# group keeps only one pending run and would cancel a queued source.json
# publish. The two touch disjoint paths, so the push below rebases and retries
# instead.
concurrency:
  group: gallery-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: main

      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages

      - name: Build gallery
        run: python3 main/gallery/build.py --out build

      - name: Publish to gh-pages/themes
        run: |
          rm -rf pages/themes
          mkdir -p pages/themes
          cp -R build/. pages/themes/
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No gallery changes"
            exit 0
          fi
          git commit -m "Publish theme gallery"
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto gh-pages"
            git pull --rebase origin gh-pages
          done
          echo "::error::Could not push to gh-pages after 3 attempts"
          exit 1
