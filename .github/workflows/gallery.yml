name: Publish site (landing page and theme gallery)

# Builds landing/ and gallery/ and publishes them to the gh-pages branch:
#   landing page  -> /index.html
#   theme gallery -> /themes/
#   demo feed     -> /demo-feeds/feed.json  (manually-added feed for Simulator use, not part of
#                    the automated screenshot flow -- see docs/ui-test-demo-data.md)
# alongside the AltStore source.json, icon.png and screenshots/ that release.yml
# already publishes there. Only index.html, themes/ and demo-feeds/ are touched, so
# those other files are never clobbered.
#
# The file keeps its old name (gallery.yml) so existing references stay valid.

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "appstore/source.template.json"
      - "gallery/**"
      - "gallery-themes/**"
      - "Themes/**"
      - "Shared/Article Rendering/core.css"
      - "demo-feeds/**"
      - ".github/workflows/gallery.yml"
  # The demo feed's item dates are relative to publish time (demo-feeds/build.py)
  # because the app ignores articles older than 90 days. Republish daily so the
  # feed never ages out. This means one small commit to gh-pages per day (the
  # dates change), while the landing page and themes stay unchanged.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serializes site runs with each other only. release.yml (publish-source)
# also pushes to gh-pages, but it is deliberately not in this group: a shared
# group keeps only one pending run and would cancel a queued source.json
# publish. The two touch disjoint paths, so the push below rebases and retries
# instead.
concurrency:
  group: gallery-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: main

      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages

      - name: Build landing page
        run: python3 main/landing/build.py --out build-landing

      - name: Build gallery
        run: python3 main/gallery/build.py --out build

      - name: Build demo feed
        run: python3 main/demo-feeds/build.py --out build-demo-feeds

      - name: Publish to gh-pages
        run: |
          cp build-landing/index.html pages/index.html
          rm -rf pages/themes
          mkdir -p pages/themes
          cp -R build/. pages/themes/
          rm -rf pages/demo-feeds
          mkdir -p pages/demo-feeds
          cp -R build-demo-feeds/. pages/demo-feeds/
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html themes demo-feeds
          if git diff --cached --quiet; then
            echo "No site changes"
            exit 0
          fi
          git commit -m "Publish site"
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto gh-pages"
            git pull --rebase origin gh-pages
          done
          echo "::error::Could not push to gh-pages after 3 attempts"
          exit 1
