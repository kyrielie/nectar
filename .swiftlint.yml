identifier_name:
  min_length: 1
  max_length: 50
  allowed_symbols: "_"

type_name:
  max_length: 50

# line_length:
#  warning: 200
#  error: 300
#  ignores_comments: true
#  ignores_urls: true

large_tuple:
  warning: 5
  error: 6

# Size signals (file_length / type_body_length). Both used to sit in
# disabled_rules, which is how the largest app files grew unopposed even
# though `swiftlint lint --strict` runs in CI (.github/workflows/ci.yml).
#
# Warnings only (no `error:` key). --strict still turns a reported warning
# into a CI failure, so each threshold has to sit above the current worst
# offender or it breaks the build.
#
# Measured with SwiftLint 0.65.1 by running with both thresholds set to 1
# and reading the reported sizes:
#   file_length max       2,812  iOS/SceneCoordinator.swift
#                         2,627  iOS/Article/WebViewController.swift
#   type_body_length max  1,322  SceneCoordinator (class body)
#                           925  AppDefaults (class body)
# file_length matches `wc -l` for these files; type_body_length counts
# non-blank, non-comment lines inside one type body.
# The thresholds below sit about 3% (file) and 6% (type body) above those
# maxima so a SwiftLint version difference in counting does not break CI.
#
# Ratchet both numbers down as the large files shrink, re-measuring the
# same way. Do not jump to SwiftLint's defaults (400 / 250): that flags
# most of the largest files at once and gets reverted instead of fixed. See
# docs/module-layout.md, "Lint size ratchet".
file_length:
  warning: 2900

type_body_length:
  warning: 1400

disabled_rules:
  - todo
  - for_where
  - force_cast
  - force_try
  - cyclomatic_complexity
  - generic_type_name
  - function_body_length
  - function_parameter_count
  - line_length
  - function_name_whitespace
  - nesting
  - class_delegate_protocol
  - optional_data_string_conversion

excluded:
  - ".build"
  - ".git"
  - ".swiftpm"
  - ".claude"
  - Modules/*/.build/
  - Modules/Account/Tests/
  - Widget/Resources/Localized.swift
  - Shared/Extensions/NSAttributedString+NetNewsWire.swift
  - buildscripts/

