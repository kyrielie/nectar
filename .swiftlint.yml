identifier_name:
  min_length: 1
  max_length: 50
  allowed_symbols: "_"

type_name:
  max_length: 50

# line_length:
#  warning: 200
#  error: 300
#  ignores_comments: true
#  ignores_urls: true

large_tuple:
  warning: 5
  error: 6

# Size signals (file_length / type_body_length). Both used to sit in
# disabled_rules, which is how WebViewController.swift (3,148 lines),
# SceneCoordinator.swift (2,786), and AppDefaults.swift (2,436) grew
# unopposed even though `swiftlint lint --strict` runs in CI
# (.github/workflows/ci.yml).
#
# Warnings only (no `error:` key). --strict still turns a reported warning
# into a CI failure, so each threshold has to sit above the current worst
# offender or it breaks the build today.
#
# file_length: 3200 is just above WebViewController.swift (3,148 lines).
# type_body_length: 2600 was set without measuring. SwiftLint counts
# non-blank, non-comment lines inside a single type body, and the large
# files here split their types across extensions, so the real maximum is
# likely far lower. Measure it (run swiftlint with the threshold
# temporarily lowered) and set it just above the real number.
#
# Ratchet both numbers down as the large files shrink. Do not jump to
# SwiftLint's defaults (400 / 250): that flags most of the largest files
# at once and gets reverted instead of fixed. See docs/module-layout.md,
# "Lint size ratchet".
file_length:
  warning: 3200

type_body_length:
  warning: 2600

disabled_rules:
  - todo
  - for_where
  - force_cast
  - force_try
  - cyclomatic_complexity
  - generic_type_name
  - function_body_length
  - function_parameter_count
  - line_length
  - function_name_whitespace
  - nesting
  - class_delegate_protocol
  - optional_data_string_conversion

excluded:
  - ".build"
  - ".git"
  - ".swiftpm"
  - ".claude"
  - Modules/*/.build/
  - Modules/Account/Tests/
  - Widget/Resources/Localized.swift
  - Shared/Extensions/NSAttributedString+NetNewsWire.swift
  - buildscripts/

