<header class="letter-header">
	<img class="letter-seal" src="[[avatar_src]]" />
	<a class="letter-source" href="[[feed_link]]">[[feed_link_title]]</a>
	<span class="letter-byline">[[byline]]</span>
</header>

<article class="letter">
	<div class="letter-title">
		<h1><a href="[[preferred_link]]">[[title]]</a></h1>
	</div>
	<div class="[[dateline_style]] letter-dateline">
		<a href="[[preferred_link]]">[[datetime_medium]]</a>
	</div>
	<div class="externalLink">[[external_link_label]] <a href="[[external_link]]">[[external_link_stripped]]</a></div>
	<div class="letter-flourish" aria-hidden="true">&#10087;</div>
	<div id="bodyContainer" class="articleBody letter-body [[text_size_class]]"
		data-versal-target
		data-chapter-divider
		data-chapter-divider-char="&#10087;"
		data-chapter-divider-class="letter-flourish letter-flourish--chapter">[[body]]</div>
</article>

<!-- The chapter-flourish divider and the drop cap below are both applied by
     the shared applyChapterDividers()/applyVersalCaps() steps in
     Shared/Article Rendering/main.js (WKUserScripts, so they run in the real
     article reader as well as the Settings theme preview), driven by the
     data-* attributes above. This theme previously carried its own inline
     <script> for the flourish, and a pure-CSS `.articleBody > p:first-of-type`
     rule for the drop cap; neither worked against real article content:
     the inline <script> never ran in the real reader (WebViewController loads
     with allowsContentJavaScript = false; only WKUserScripts are exempt), and
     the direct-child CSS selector never matched real AO3 chapter prose, which
     AO3ChapterHTMLExtractor always nests one level deeper inside a
     div.userstuff.module[role="article"] wrapper -- a structure the flat
     Settings-preview sample body didn't reproduce, which is why the old
     selector looked correct there and was wrong for every real article.
     See Technotes/Themes.md. -->
