<div class="ar-page">
	<div class="ar-top"><a class="ar-feed" href="[[feed_link]]">[[feed_link_title]]</a><time datetime="[[datetime_long]]">[[date_medium]]</time></div>
	<header class="ar-head">
		<div class="ar-emblem" aria-hidden="true"></div>
		<h1 class="ar-title"><a href="[[preferred_link]]">[[title]]</a></h1>
		<p class="ar-by">[[byline]]</p>
	</header>
	<div id="bodyContainer" class="articleBody ar-body [[text_size_class]]" data-versal-target data-chapter-divider data-chapter-divider-char="&#8203;" data-chapter-divider-class="dv">[[body]]</div>
</div>
