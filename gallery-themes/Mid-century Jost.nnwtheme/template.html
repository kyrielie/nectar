<div class="fontSize [[text_size_class]] jostPage">

	<header class="jostHeader">
		<div class="articleTitle"><h1><a href="[[preferred_link]]">[[title]]</a></h1></div>
		<div class="byline">by [[byline]]</div>
	</header>

	<article>
		<div id="bodyContainer" class="articleBody jostBody [[text_size_class]]" data-chapter-divider data-chapter-divider-char="/" data-chapter-divider-class="jostBar">[[body]]</div>
	</article>

	<div id="nnwFooter" class="jostFooter">
		<div class="externalLink singleLine">[[external_link_label]] <a href="[[external_link]]">[[external_link_stripped]]</a></div>
	</div>

</div>
