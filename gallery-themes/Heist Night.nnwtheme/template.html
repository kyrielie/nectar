<div class="sc-page">

	<header class="sc-card">
		<span class="sc-corner sc-corner--tl" aria-hidden="true"><b>VI</b><i>&#9670;</i></span>
		<span class="sc-corner sc-corner--br" aria-hidden="true"><b>VI</b><i>&#9670;</i></span>

	<div id="bodyContainer" class="articleBody sc-body [[text_size_class]]" data-versal-target data-chapter-divider data-chapter-divider-char="&#8203;" data-chapter-divider-class="dv">[[body]]</div>
