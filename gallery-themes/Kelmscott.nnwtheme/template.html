<div class="fontSize [[text_size_class]] kelmscott-page">

	<header class="kelmscottHeader">
		<div class="kelmscottHeaderInner">
			<img class="kelmscottAvatar nnw-nozoom" id="nnwImageIcon" src="[[avatar_src]]" />
			<a class="kelmscottFeedlink" href="[[feed_link]]">[[feed_link_title]]</a>
			<span class="kelmscottByline">[[byline]]</span>
		</div>
	</header>

	<div class="kelmscottFrame">

		<div class="kelmscottTitleBlock">
			<div class="kelmscottTitle"><a href="[[preferred_link]]">[[title]]</a></div>
			<div class="[[dateline_style]] kelmscottDateline"><a href="[[preferred_link]]">[[date_long]]</a></div>
		</div>

		<div class="kelmscottRule" aria-hidden="true"></div>

		<article>
			<div id="bodyContainer" class="articleBody kelmscottBody [[text_size_class]]" data-versal-target>[[body]]</div>
		</article>

		<div id="nnwFooter" class="kelmscottFooter">
			<div class="externalLink singleLine">[[external_link_label]] <a href="[[external_link]]">[[external_link_stripped]]</a></div>
		</div>

	</div>

</div>

<!-- Versal/drop-cap treatment is applied by the shared applyVersalCaps() in
     Shared/Article Rendering/main.js (a WKUserScript, so it runs in the real
     article reader as well as the Settings theme preview), triggered by the
     data-versal-target attribute above. It wraps the opening sentence of the
     work's first paragraph, and of the first paragraph after every chapter
     heading, in <span class="versalCap"> -- see .kelmscottBody
     p:has(> .versalCap:first-child)::first-letter and .versalCap below.
     Kelmscott Press books decorated an initial at the start of every
     chapter, not just the work, hence "every chapter heading" and not just
     the opening paragraph. This theme previously carried its own inline
     <script> to do this; that never ran in the real reader, only in the
     Settings preview, because the reader loads with
     allowsContentJavaScript = false. See Technotes/Themes.md. -->
