<div class="fontSize [[text_size_class]] stickerPage">

	<header class="stickerHeader">
		<div class="articleTitle"><h1><a href="[[preferred_link]]">[[title]]</a></h1></div>
		<div class="byline">by [[byline]]</div>
	</header>

	<article>
		<div id="bodyContainer" class="articleBody stickerBody [[text_size_class]]" data-versal-target data-chapter-divider data-chapter-divider-char="&#10022;" data-chapter-divider-class="stickerStar">[[body]]</div>
	</article>

	<div id="nnwFooter" class="stickerFooter">
		<div class="externalLink singleLine">[[external_link_label]] <a href="[[external_link]]">[[external_link_stripped]]</a></div>
	</div>

</div>
